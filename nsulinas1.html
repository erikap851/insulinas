<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Insulinas PRO</title>
    <!-- Bibliotekos -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; background-color: #F8FAFC; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .animate-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        input[type="time"]::-webkit-calendar-picker-indicator { background: transparent; bottom: 0; color: transparent; cursor: pointer; height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SUTVARKYTAS PIKTOGRAMŲ KOMPONENTAS (SVG) ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Droplet: <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>,
                History: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 0V4m0 4h4m5 4h4.5m-4.5 0V7.5"/>,
                Settings: (
                    <React.Fragment>
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2 2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 0-2-2h-.44a2 2 0 0 0-2 2 2 2 0 0 0 2 2 2 2 0 0 1 2 2 2 2 0 0 1-2 2 2 2 0 0 0-2 2v.44a2 2 0 0 0 2 2 2 2 0 0 0 2-2 2 2 0 0 1 2-2 2 2 0 0 1 2 2 2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2 2 2 0 0 0-2-2 2 2 0 0 1-2-2 2 2 0 0 1 2-2 2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </React.Fragment>
                ),
                AlertTriangle: <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3ZM12 9v4m0 4h.01"/>,
                RefreshCw: <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8m0 0V4m0 4h-4M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16m0 0v4m0-4h-4"/>,
                Syringe: <path d="m18 2 4 4m-11 4 4-4m-4.1 10.6L7 22l-1-1 5.4-5.4m2.8-2.8 3.9-3.9a2.8 2.8 0 0 0-4-4l-3.9 3.9m3.3 3.3-3.9 3.9a2 2 0 0 1-2.8 0l-1.4-1.4a2 2 0 0 1 0-2.8l3.9-3.9"/>,
                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>,
                X: <path d="M18 6 6 18M6 6l12 12"/>,
                Clock: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </React.Fragment>
                ),
                UploadCloud: <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M12 12v9m-3-3 3-3 3 3"/>,
                Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/>,
                Camera: (
                    <React.Fragment>
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                        <circle cx="12" cy="13" r="3"/>
                    </React.Fragment>
                ),
                Image: (
                    <React.Fragment>
                        <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                        <circle cx="9" cy="9" r="2"/>
                        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                    </React.Fragment>
                )
            };

            return (
                <svg 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        function App() {
            // --- BŪSENOS ---
            const [currentBG, setCurrentBG] = useState('');
            const [bgDelta, setBgDelta] = useState(''); 
            const [carbs, setCarbs] = useState('');
            const [proteins, setProteins] = useState('');
            const [fats, setFats] = useState('');
            const [iob, setIob] = useState(0);
            const [activeProfile, setActiveProfile] = useState('diena');
            const [historyData, setHistoryData] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [result, setResult] = useState(null);
            const [actualDose, setActualDose] = useState('');
            const [manualTime, setManualTime] = useState(''); 
            const [syncStatus, setSyncStatus] = useState('idle');
            const [isEditingBase, setIsEditingBase] = useState(false);
            const [tempBase, setTempBase] = useState('15');
            const [showSettings, setShowSettings] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [showHypo, setShowHypo] = useState(false);
            const [isCameraOpen, setIsCameraOpen] = useState(false);
            const [cameraStream, setCameraStream] = useState(null);

            const [settings, setSettings] = useState({
                targetBG: '5.5',
                isf: '2.0',
                ratioMorning: '12', 
                ratioDay: '10',
                ratioEvening: '10',
                tresibaDose: '15'
            });

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const galleryInputRef = useRef(null);
            const nativeCameraInputRef = useRef(null);
            const importFileRef = useRef(null);

            // --- FUNKCIJOS ---

            const handleImageInput = (e) => {
                const file = e.target.files[0];
                if (file) alert("Pasirinkta nuotrauka: " + file.name);
            };

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment', width: { ideal: 1280 } } 
                    });
                    setCameraStream(stream);
                    setIsCameraOpen(true);
                } catch (err) {
                    if (nativeCameraInputRef.current) nativeCameraInputRef.current.click();
                }
            };

            const stopCamera = () => {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                    setCameraStream(null);
                }
                setIsCameraOpen(false);
            };

            const capturePhoto = () => {
                if (!videoRef.current || !canvasRef.current) return;
                const canvas = canvasRef.current;
                canvas.width = videoRef.current.videoWidth;
                canvas.height = videoRef.current.videoHeight;
                canvas.getContext('2d').drawImage(videoRef.current, 0, 0);
                stopCamera();
                alert("Nuotrauka užfiksuota!");
            };

            const syncWithXDrip = async () => {
                setIsSyncing(true);
                try {
                    const response = await fetch('http://127.0.0.1:17580/sgv.json?count=1');
                    const data = await response.json();
                    if (data && data[0]) {
                        setCurrentBG((data[0].sgv / 18.018).toFixed(1));
                        setBgDelta(data[0].delta ? (data[0].delta / 18.018).toFixed(1) : '0');
                        setSyncStatus('success');
                    }
                } catch (err) { setSyncStatus('error'); }
                finally { setIsSyncing(false); }
            };

            const calculate = () => {
                const bg = parseFloat(currentBG);
                const deltaVal = parseFloat(bgDelta) || 0;
                const icr = parseFloat(activeProfile === 'rytas' ? settings.ratioMorning : activeProfile === 'vakaras' ? settings.ratioEvening : settings.ratioDay);
                if (isNaN(bg) && !carbs) return;

                let total = (parseFloat(carbs) || 0) / icr;
                if (!isNaN(bg)) {
                    let corr = (bg - parseFloat(settings.targetBG)) / parseFloat(settings.isf);
                    if (deltaVal > 0.3) corr += (deltaVal * 2) / parseFloat(settings.isf);
                    total += corr - iob;
                }
                const rounded = Math.round(Math.max(0, total) * 2) / 2;
                setResult({ rounded });
                setActualDose(rounded.toString());
            };

            const save = () => {
                let finalTs = new Date();
                if (manualTime) {
                    const [h, m] = manualTime.split(':');
                    finalTs.setHours(parseInt(h), parseInt(m));
                }
                const entry = { timestamp: finalTs.toISOString(), bg: currentBG, delta: bgDelta, carbs, dose: actualDose };
                const newData = [entry, ...historyData];
                setHistoryData(newData);
                localStorage.setItem('ins_hist_v3', JSON.stringify(newData));
                setResult(null); setCarbs(''); setCurrentBG(''); setBgDelta(''); setManualTime('');
            };

            const exportCSV = () => {
                const csv = "\uFEFFTimestamp,Cukrus,Delta,Angl,Doze\n" + 
                    historyData.map(e => `"${e.timestamp}","${e.bg}","${e.delta}","${e.carbs}","${e.dose}"`).join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.setAttribute('download', `istorija.csv`);
                link.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const lines = event.target.result.split('\n');
                        const imported = lines.slice(1).filter(l => l.trim()).map(line => {
                            const p = line.split(',');
                            return { 
                                timestamp: p[0]?.replace(/"/g, ''), 
                                bg: p[1]?.replace(/"/g, ''), 
                                delta: p[2]?.replace(/"/g, ''), 
                                carbs: p[3]?.replace(/"/g, ''), 
                                dose: p[4]?.replace(/"/g, '') 
                            };
                        });
                        setHistoryData(imported);
                        localStorage.setItem('ins_hist_v3', JSON.stringify(imported));
                        alert("Duomenys importuoti!");
                    } catch (err) { alert("Klaida faile."); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const updateSetting = (key, val) => {
                const newS = { ...settings, [key]: val };
                setSettings(newS);
                localStorage.setItem('ins_set_v3', JSON.stringify(newS));
            };

            // --- EFEKTAI ---
            useEffect(() => {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 11) setActiveProfile('rytas');
                else if (hour >= 18 || hour < 5) setActiveProfile('vakaras');
                else setActiveProfile('diena');

                const h = localStorage.getItem('ins_hist_v3');
                if (h) setHistoryData(JSON.parse(h));
                const s = localStorage.getItem('ins_set_v3');
                if (s) {
                    const p = JSON.parse(s);
                    setSettings(p);
                    setTempBase(p.tresibaDose || '15');
                }
                syncWithXDrip();
            }, []);

            useEffect(() => {
                const now = new Date().getTime();
                let ti = 0;
                historyData.forEach(e => {
                    const hrs = (now - new Date(e.timestamp).getTime()) / 3600000;
                    if (hrs < 4 && e.dose > 0) ti += e.dose * Math.pow(1 - (hrs / 4), 2);
                });
                setIob(ti);
            }, [historyData]);

            useEffect(() => {
                if (isCameraOpen && cameraStream && videoRef.current) {
                    videoRef.current.srcObject = cameraStream;
                    videoRef.current.play().catch(e => console.error(e));
                }
            }, [isCameraOpen, cameraStream]);

            useEffect(() => {
                if (!manualTime && (carbs || currentBG)) {
                    const now = new Date();
                    setManualTime(now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0'));
                }
            }, [carbs, currentBG, manualTime]);

            return (
                <div className="min-h-screen flex flex-col items-center pb-32 w-full max-w-md mx-auto">
                    {/* Header */}
                    <div className="bg-[#0F172A] text-white p-5 pb-14 w-full shadow-2xl sticky top-0 z-50">
                        <div className="flex justify-between items-center px-1">
                            <div className="flex flex-col text-left">
                                <h1 className="text-xl font-black uppercase italic text-blue-400 flex items-center gap-2">
                                    <Icon name="Droplet" size={24} className="text-blue-500" /> PRO
                                </h1>
                                <div className="flex items-center gap-1.5 mt-1 opacity-50">
                                    <div className={`w-1.5 h-1.5 rounded-full ${syncStatus === 'error' ? 'bg-red-500' : 'bg-green-500'}`}></div>
                                    <span className="text-[9px] font-bold uppercase tracking-widest">{syncStatus === 'error' ? 'BLOKUOJAMA' : 'XDRIP OK'}</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowHypo(true)} className="p-2.5 bg-red-500/20 text-red-400 rounded-2xl border border-red-500/20"><Icon name="AlertTriangle" size={22}/></button>
                                <button onClick={() => setShowHistory(true)} className="p-2.5 bg-white/10 rounded-2xl border border-white/5"><Icon name="History" size={22}/></button>
                                <button onClick={() => setShowSettings(true)} className="p-2.5 bg-white/10 rounded-2xl border border-white/5"><Icon name="Settings" size={22}/></button>
                            </div>
                        </div>
                        <div className="mt-8 flex gap-4">
                            <div className="bg-slate-800/40 p-4 rounded-[28px] flex-1 text-center border border-white/5 shadow-inner">
                                <span className="block text-[10px] uppercase font-black opacity-30 mb-1">Aktyvus IOB</span>
                                <span className="text-2xl font-black text-blue-400">{iob.toFixed(2)}</span>
                            </div>
                            <div className="bg-slate-800/40 p-4 rounded-[28px] flex-1 text-center border border-white/5 shadow-inner cursor-pointer" onClick={() => setIsEditingBase(true)}>
                                <span className="block text-[10px] uppercase font-black opacity-30 mb-1 tracking-widest text-green-300">BAZĖ (T) {!isEditingBase && <Icon name="Edit2" size={8}/>}</span>
                                {isEditingBase ? (
                                    <input autoFocus type="number" value={tempBase} onChange={e => setTempBase(e.target.value)} className="w-16 bg-transparent font-black text-xl text-green-400 outline-none text-center" onBlur={() => { setIsEditingBase(false); updateSetting('tresibaDose', tempBase); }}/>
                                ) : ( <span className="text-2xl font-black text-green-400">{tempBase}</span> )}
                            </div>
                        </div>
                    </div>

                    <div className="w-full p-4 -mt-10 relative z-20 space-y-4">
                        <div className="bg-white p-6 rounded-[50px] shadow-2xl border border-slate-100 text-center">
                            <div className="flex bg-slate-100 p-1 rounded-3xl mb-8 shadow-inner">
                                {['rytas', 'diena', 'vakaras'].map(p => (
                                    <button key={p} onClick={() => setActiveProfile(p)} className={`flex-1 py-4 rounded-[24px] text-[10px] font-black transition-all uppercase ${activeProfile === p ? 'bg-white text-blue-600 shadow-xl scale-[1.03]' : 'text-slate-400'}`}>{p}</button>
                                ))}
                            </div>

                            <div className="space-y-4 mb-6 text-center">
                                <div className="bg-slate-50 p-5 rounded-[36px] relative border border-slate-100 flex flex-col min-h-[110px]">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest text-left font-bold mb-2">Sensorius</label>
                                    <div className="flex items-center justify-between gap-4">
                                        <div className="flex-1 text-left">
                                            <input type="number" step="0.1" value={currentBG} onChange={e => setCurrentBG(e.target.value)} className="w-full text-6xl font-black bg-transparent outline-none tracking-tighter" placeholder="0.0"/>
                                        </div>
                                        <div className="flex flex-col items-end gap-1">
                                            <span className="text-[8px] font-black uppercase opacity-40 pr-2">Pokytis</span>
                                            <input type="number" step="0.1" value={bgDelta} onChange={e => setBgDelta(e.target.value)} placeholder="±0.0" className={`w-20 text-center py-2 font-black rounded-2xl border-2 shadow-sm outline-none transition-all ${parseFloat(bgDelta) > 0 ? 'bg-red-50 text-red-600 border-red-200' : parseFloat(bgDelta) < 0 ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-white border-slate-100 text-slate-400'}`}/>
                                        </div>
                                    </div>
                                    <button onClick={syncWithXDrip} className="absolute top-4 right-4 p-2.5 rounded-2xl bg-white shadow-md text-blue-600 active:scale-90 transition-all border border-slate-50"><Icon name="RefreshCw" size={20}/></button>
                                </div>

                                <div className="bg-slate-50 p-6 rounded-[36px] border border-slate-100 text-left">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Angliavandeniai (g)</label>
                                    <input type="number" value={carbs} onChange={e => setCarbs(e.target.value)} className="w-full text-5xl font-black bg-transparent outline-none tracking-tighter" placeholder="0"/>
                                </div>

                                <div className="flex gap-4 pt-3 border-t border-slate-50">
                                    <button onClick={startCamera} className="flex-1 bg-white border border-purple-100 p-4 rounded-3xl flex items-center justify-center gap-3 text-purple-600 font-black uppercase text-[10px] tracking-widest shadow-md"><Icon name="Camera" size={18}/> Kamera</button>
                                    <button onClick={() => galleryInputRef.current?.click()} className="flex-1 bg-white border border-purple-100 p-4 rounded-3xl flex items-center justify-center gap-3 text-purple-600 font-black uppercase text-[10px] tracking-widest shadow-md"><Icon name="Image" size={18}/> Galerija</button>
                                </div>
                            </div>

                            <button onClick={calculate} className="w-full bg-blue-600 text-white font-black py-7 rounded-[40px] shadow-2xl active:scale-95 text-xl uppercase tracking-[0.2em] shadow-blue-500/30">Skaičiuoti</button>
                        </div>

                        {result && (
                            <div className="bg-white p-10 rounded-[64px] shadow-2xl border-2 border-blue-50 text-center animate-in">
                                <div className="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] mb-4 opacity-50">Rekomenduojama</div>
                                <div className="text-[110px] font-black text-slate-800 tracking-tighter leading-none">{result.rounded} <span className="text-3xl text-slate-300 font-bold uppercase ml-1 tracking-widest">vnt</span></div>
                                <div className="mt-10 space-y-4 text-left">
                                    <div className="bg-blue-50 p-4 rounded-3xl border border-blue-100 flex items-center gap-4 shadow-inner">
                                        <Icon name="Clock" className="text-blue-600" size={20}/>
                                        <div className="flex-1 text-left">
                                            <label className="text-[9px] font-black text-blue-700 uppercase block mb-0.5 tracking-widest">Kada vartota?</label>
                                            <input type="time" value={manualTime} onChange={e => setManualTime(e.target.value)} className="w-full bg-transparent font-black text-xl text-blue-950 outline-none border-none p-0"/>
                                        </div>
                                    </div>
                                    <div className="bg-green-50 p-7 rounded-[40px] border border-green-100 flex items-center gap-6 shadow-sm">
                                        <div className="bg-green-600 p-5 rounded-3xl text-white shadow-xl"><Icon name="Syringe" size={36}/></div>
                                        <div className="flex-1"><label className="text-[11px] font-black text-green-700 uppercase block tracking-widest mb-0.5 text-left">Leidžiuosi:</label><input type="number" step="0.5" value={actualDose} onChange={e => setActualDose(e.target.value)} className="w-full bg-transparent font-black text-5xl outline-none text-green-950"/></div>
                                    </div>
                                    <button onClick={save} className="w-full bg-green-600 text-white py-8 rounded-[40px] font-black shadow-2xl text-xl uppercase tracking-[0.3em] active:scale-95 transition-all">Išsaugoti</button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODALAI */}
                    {showHistory && (
                        <div className="fixed inset-0 bg-slate-900/98 z-[200] flex items-center justify-center p-4 backdrop-blur-3xl animate-in text-left text-slate-800">
                            <div className="bg-white w-full max-w-md rounded-[60px] p-10 max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                                <div className="flex justify-between items-center mb-10">
                                    <h3 className="font-black text-2xl uppercase tracking-tighter italic">Istorija</h3>
                                    <div className="flex gap-2">
                                        <button onClick={() => importFileRef.current.click()} className="p-3 bg-green-50 text-green-600 rounded-xl active:scale-90" title="Atkurti"><Icon name="UploadCloud" size={20}/></button>
                                        <button onClick={exportCSV} className="p-3 bg-blue-50 text-blue-600 rounded-xl active:scale-90" title="Eksportuoti"><Icon name="Download" size={20}/></button>
                                        <button onClick={() => setShowHistory(false)} className="p-3 bg-slate-100 rounded-full active:scale-90"><Icon name="X" size={24}/></button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-4 pr-1 scrollbar-hide">
                                    {historyData.map((e, i) => (
                                        <div key={i} className="bg-slate-50 p-6 rounded-[36px] flex justify-between items-center border border-slate-100 shadow-sm transition-all hover:bg-white text-left">
                                            <div className="text-left">
                                                <div className="text-[10px] text-slate-400 font-black mb-1 uppercase tracking-widest">{new Date(e.timestamp).toLocaleString('lt-LT')}</div>
                                                <div className="font-black text-3xl text-slate-800">{e.dose} <small className="text-xs uppercase opacity-30">vnt</small></div>
                                                <div className="text-[8px] font-black uppercase mt-1 opacity-40">A: {e.carbs || 0}g</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-black text-red-500 bg-white px-4 py-2 rounded-xl text-sm border border-red-50 shadow-sm">BG: {e.bg}</div>
                                                <div className="text-[10px] font-black opacity-20 mt-1 uppercase text-right">Δ {e.delta}</div>
                                            </div>
                                        </div>
                                    ))}
                                    {historyData.length === 0 && <div className="text-center py-20 opacity-20 uppercase font-black tracking-widest text-xs text-center w-full">Tuščia</div>}
                                </div>
                                <input type="file" ref={importFileRef} className="hidden" accept=".csv" onChange={importData}/>
                            </div>
                        </div>
                    )}

                    {showHypo && (
                        <div className="fixed inset-0 bg-red-950/95 z-[200] flex items-center justify-center p-6 backdrop-blur-2xl animate-in text-left">
                            <div className="bg-white w-full max-w-md rounded-[50px] p-10 shadow-2xl relative">
                                <button onClick={() => setShowHypo(false)} className="absolute top-6 right-6 p-3 bg-red-50 text-red-500 rounded-full active:scale-90"><Icon name="X" size={24}/></button>
                                <h3 className="font-black text-3xl uppercase tracking-tighter text-red-600 mb-8 italic flex items-center gap-2 font-bold"><Icon name="AlertTriangle" size={32}/> Hipo Pagalba</h3>
                                <div className="space-y-8">
                                    <div className="flex gap-5"><div className="bg-red-100 text-red-600 w-14 h-14 rounded-2xl flex items-center justify-center font-black text-2xl shrink-0 border border-red-200 shadow-sm font-bold">15</div><div><h4 className="font-black uppercase text-sm tracking-widest mb-1 text-slate-800 font-bold">15g angliavandenių</h4><p className="text-[12px] text-slate-500 font-bold italic leading-tight">Sultys, gliukozė, šaukštas medaus arba koka-kola.</p></div></div>
                                    <div className="flex gap-5"><div className="bg-blue-100 text-blue-600 w-14 h-14 rounded-2xl flex items-center justify-center font-black text-2xl shrink-0 border border-blue-200 shadow-sm font-bold">15</div><div><h4 className="font-black uppercase text-sm tracking-widest mb-1 text-slate-800 font-bold">15 minučių laukti</h4><p className="text-[12px] text-slate-500 font-bold italic leading-tight text-left">Nevalgyti daugiau! Palaukti, kol cukrus pradės kilti.</p></div></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 bg-slate-900/98 z-[200] flex items-center justify-center p-4 backdrop-blur-3xl animate-in text-center text-slate-800">
                            <div className="bg-white w-full max-w-md rounded-[56px] p-10 shadow-2xl text-center text-slate-800">
                                <div className="flex justify-between items-center mb-10 font-black text-2xl uppercase tracking-tighter">Nustatymai <button onClick={() => setShowSettings(false)} className="p-4 bg-slate-100 rounded-full active:scale-90 shadow-sm"><Icon name="X" size={28}/></button></div>
                                <div className="grid grid-cols-2 gap-6 text-left">
                                    <div className="bg-slate-50 p-7 rounded-[40px] shadow-inner border border-slate-100 text-slate-800"><label className="text-[11px] text-slate-500 block font-black uppercase mb-1 tracking-widest text-left font-bold">Tikslas</label><input type="number" step="0.1" value={settings.targetBG} onChange={e => updateSetting('targetBG', e.target.value)} className="w-full bg-transparent font-black text-3xl outline-none text-left text-slate-800"/></div>
                                    <div className="bg-slate-50 p-7 rounded-[40px] shadow-inner border border-slate-100 text-slate-800"><label className="text-[11px] text-slate-500 block font-black uppercase mb-1 tracking-widest text-left font-bold">ISF</label><input type="number" step="0.1" value={settings.isf} onChange={e => updateSetting('isf', e.target.value)} className="w-full bg-transparent font-black text-3xl outline-none text-left text-slate-800"/></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Kameros vaizdas */}
                    {isCameraOpen && (
                        <div className="fixed inset-0 z-[500] bg-black flex flex-col animate-in">
                            <div className="relative flex-1 overflow-hidden">
                                <video ref={videoRef} autoPlay playsInline muted className="absolute inset-0 w-full h-full object-cover" />
                                <div className="absolute inset-0 border-[2px] border-white/20 m-12 rounded-[40px] pointer-events-none"></div>
                            </div>
                            <canvas ref={canvasRef} className="hidden" />
                            <div className="p-12 flex justify-between items-center bg-slate-900 border-t border-white/5 shadow-inner">
                                <button onClick={stopCamera} className="p-5 bg-slate-800 rounded-3xl text-white active:scale-90 shadow-xl"><Icon name="X" size={32}/></button>
                                <button onClick={capturePhoto} className="p-8 bg-white rounded-full text-slate-900 border-[10px] border-slate-700 shadow-2xl active:scale-90"><Icon name="Camera" size={44}/></button>
                                <button onClick={() => { stopCamera(); galleryInputRef.current?.click(); }} className="p-5 bg-slate-800 rounded-3xl text-white active:scale-90 shadow-xl"><Icon name="Image" size={32}/></button>
                            </div>
                        </div>
                    )}

                    {/* Paslėpti įvesties laukai */}
                    <input type="file" accept="image/*" className="hidden" ref={galleryInputRef} onChange={handleImageInput} />
                    <input type="file" accept="image/*" capture="environment" className="hidden" ref={nativeCameraInputRef} onChange={handleImageInput} />
                    <input type="file" accept=".csv" className="hidden" ref={importFileRef} onChange={importData} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
